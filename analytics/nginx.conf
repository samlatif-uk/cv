# Server-level guard also covers requests under ^~ prefix locations.
# Keep ACME challenges accessible while denying hidden files at any depth.
if ($uri ~ "(^|/)\.(?!well-known(?:/|$))") { return 404; }
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

location = /api/visit {
    limit_req zone=sam_views burst=20 nodelay;
    client_max_body_size 1k;
    client_body_timeout 5s;
    access_log off;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Analytics-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
location = /insights { return 302 /insights/; }
location = /insights/login {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    limit_req zone=sam_login burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /insights/ {
    client_max_body_size 1k;
    client_body_timeout 5s;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    limit_req zone=sam_dashboard burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
