name: Check site build
on:
  pull_request:
    paths:
      - 'react.samlatif.uk/**'
      - 'shared/**'
      - 'analytics/**'
      - 'scripts/react.nginx.conf'
      - '.github/workflows/deploy-react-vps.yml'
      - '.github/workflows/check-site.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react.samlatif.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react.samlatif.uk/package-lock.json
      - run: python3 ../analytics/test_server.py
      - run: python3 ../analytics/test_update_geo.py
      - run: node ../analytics/test_dashboard.cjs
      - run: bash -n ../analytics/install.sh
      - run: npm ci
      - run: npm run test:lab
      - run: npm run build
