name: Check site build
on:
  pull_request:
    paths:
      - 'react.samlatif.uk/**'
      - 'shared/**'
      - '.github/workflows/check-site.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react.samlatif.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react.samlatif.uk/package-lock.json
      - run: npm ci
      - run: npm run test:lab
      - run: npm run build
